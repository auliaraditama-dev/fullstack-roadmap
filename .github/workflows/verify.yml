name: Verify release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:static
      - run: npm run validate:content
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: node scripts/vercel-output.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run preview > /tmp/fullstack-roadmap-preview.log 2>&1 &
      - run: |
          node - <<'NODE'
          const pause = () => new Promise((resolve) => setTimeout(resolve, 500));
          for (let i = 0; i < 30; i += 1) {
            try {
              const response = await fetch('http://127.0.0.1:4321');
              if (response.ok) process.exit(0);
            } catch {}
            await pause();
          }
          process.exit(1);
          NODE
      - run: npm run audit:performance
      - uses: actions/upload-artifact@v7
        with:
          name: verified-static-release
          path: |
            dist
            .vercel/output
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-reports
          path: |
            playwright-report
            .reports/performance
